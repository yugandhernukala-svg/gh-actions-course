name: 03-Workflow Runners

on: push

jobs:
    ubuntu-echo:
     runs-on: ubuntu-latest
     steps:
      - name: Show Id
        run: |
         echo "This job is running on an Ubuntu runner"
         echo "Runner OS: ${{ runner.os }}"
    windows-echo:
     runs-on: windows-latest
     steps:
      - name: Show Id
        run: |
         echo "This job is running on a Windows runner"
         echo "Runner OS: ${{ runner.os }}"